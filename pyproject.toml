[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-loop-chaos"
dynamic = ["version"]
description = "Chaos engineering for agent loops, with output designed for machines, not dashboards."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "agent-loop-chaos contributors" }]
keywords = [
    "agent", "chaos-engineering", "llm", "langgraph", "evaluation",
    "fault-injection", "reliability", "testing",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# jsonschema is the ONLY required dependency. Everything else is an extra, imported
# locally by the adapter or judge that needs it (CLAUDE.md, non-negotiable rules).
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2,<0.7", "langchain-core>=0.3"]
slm = ["httpx>=0.27"]
yaml = ["pyyaml>=6"]
anthropic = ["anthropic>=0.40"]
all = ["agent-loop-chaos[langgraph,slm,yaml]"]
# pyyaml IS in dev: every gate command in RUNBOOK.md and phases 04/06/07/08 runs a
# .yaml suite after installing only [dev] (D-27). It stays an optional RUNTIME extra
# as [yaml].
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema>=4.23",
    "types-PyYAML>=6",
    "hypothesis>=6.100",
    "build>=1.2",
    "twine>=5.1",
    "pyyaml>=6",
]

[project.scripts]
alc = "agent_loop_chaos.cli:main"

[project.urls]
Homepage = "https://github.com/dilipgdt/agent-loop-chaos"
Documentation = "https://github.com/dilipgdt/agent-loop-chaos/tree/main/docs"
Source = "https://github.com/dilipgdt/agent-loop-chaos"
Changelog = "https://github.com/dilipgdt/agent-loop-chaos/blob/main/CHANGELOG.md"
Issues = "https://github.com/dilipgdt/agent-loop-chaos/issues"

[tool.hatch.version]
path = "src/agent_loop_chaos/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_loop_chaos"]

# The schemas are the product; they ship so a consumer can validate a report without
# cloning the repo (docs/04-SCHEMAS.md). They live inside the package directory, so
# hatchling includes them automatically -- a force-include here would create a real
# directory in site-packages that shadows the editable-install path hook and turns
# `agent_loop_chaos` into a namespace package. Judge prompts (M6) ship the same way.

[tool.hatch.build.targets.sdist]
include = [
    "src/agent_loop_chaos",
    "tests",
    "docs",
    "schemas",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SAFETY.md",
    "LICENSE",
    "NOTICE",
    "Makefile",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Ruff >=0.16 formats Python code blocks inside Markdown. The docs are the normative
# specification and their code blocks are hand-aligned, so formatting them silently
# rewrites the spec. Ruff lints nothing in Markdown, so excluding it costs nothing.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[[tool.mypy.overrides]]
# Optional and imported locally with a silent fallback; there are no stubs, and
# requiring them would make an optional dependency effectively mandatory.
module = ["tiktoken"]
ignore_missing_imports = true

[tool.mypy]
strict = true
files = "src/agent_loop_chaos"
python_version = "3.10"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Resolve the package from the source tree. A src-layout project normally leans on
# the editable install's .pth for this, but macOS sets the UF_HIDDEN flag on files
# written into .venv and current CPython silently skips hidden .pth files -- which
# breaks `import agent_loop_chaos` with no diagnostic. This makes the suite
# independent of install mode; wheel correctness is verified separately by building
# and installing into a clean venv.
pythonpath = ["src", "."]
markers = [
    "live: needs a real model endpoint or network; excluded from the default run",
    "slow: end-to-end demo-suite tests",
]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Emitted by langgraph on import; not ours to fix, and failing the suite on a
    # third-party deprecation would make the extra untestable. Matched by message
    # rather than by class: naming a langchain class here breaks pytest startup in
    # the `langgraph = none` CI column, which is the one column that proves the core
    # has no framework dependency.
    "ignore:.*allowed_objects.*",
]

[tool.coverage.run]
source = ["src/agent_loop_chaos"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
